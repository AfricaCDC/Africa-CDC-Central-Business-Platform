##
# RBM Platform — API Gateway (Nginx)
# Internal reverse proxy. Routes URL prefixes to backend services.
# Uses Docker's embedded DNS resolver (127.0.0.11) so container
# restarts never produce stale-IP 502s.
#
# Security-header ownership: HSTS is set ONLY at nginx-proxy (TLS edge).
# This gateway owns CSP, CORS, and all non-HSTS security headers.
# See D-20260415-09 for the consolidated ownership map.
##

# ── Rate limiting zones (http context) ──
# auth_zone   : refresh + the removed password routes — brute-force defence (60r/m)
# api_zone    : authenticated API traffic (60r/s)
# upload_zone : large multipart uploads (5r/s)
# conn_per_ip : concurrent connection cap (F-031 / T-27)
# Proxy cache for the SPA HTML entry point. Keeps the last-good
# /index.html on disk so that when the web-app container hiccups,
# users still see the app shell instead of a 502 page — zero visible
# outage for brief backend restarts.
proxy_cache_path /var/cache/nginx/spa levels=1:2 keys_zone=spa_cache:10m
                 max_size=50m inactive=30d use_temp_path=off;

limit_req_zone  $binary_remote_addr zone=auth_zone:10m   rate=60r/m;
limit_req_zone  $binary_remote_addr zone=api_zone:32m    rate=60r/s;
limit_req_zone  $binary_remote_addr zone=upload_zone:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
# Staff reach the app through shared office IPs, so the per-IP connection cap
# on / and /api/ is set for a whole office (200), not one browser
# (D-20261106-11). The app limiters count per signed-in user.

# Return 429 for rate-limited requests (T-06 / F-006 — was 503 by default).
limit_req_status  429;
limit_conn_status 429;

# Structured access log — includes $request_id for cross-service correlation
# with downstream services' pino/JSON logs (T-14 / T-15 / F-013).
log_format gateway '$remote_addr - $remote_user [$time_iso8601] '
                   '"$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time '
                   'rid=$request_id '
                   'ref="$http_referer" ua="$http_user_agent" '
                   'xff="$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log  warn;   # T-30 — was 'notice'/'info' default

    # Hide nginx/upstream identification (T-16 / F-014).
    server_tokens off;

    # ── Real-IP trust chain (T-01 / T-30 / F-001) ──
    # The gateway sits behind nginx-proxy (TLS terminator) on the Docker bridge.
    # Without this block, $binary_remote_addr resolves to the single nginx-proxy
    # IP and every rate-limit zone degrades into a global cap.
    set_real_ip_from   127.0.0.1;
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    # Docker embedded DNS — re-resolves service IPs dynamically so container
    # restarts never cause stale-IP 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Upstream addresses as variables — forces nginx to use the resolver on
    # every request instead of caching the IP at startup.
    set $api_server           http://api-server:4000;
    set $notification_service http://notification-service:3005;
    set $sync_service         http://sync-service:3006;
    set $web_app              http://web-app:80;

    # Redirect policy (F-019) — prevent Mixed-Content behind HTTPS proxy and
    # stop port leak in 3xx Location headers.
    absolute_redirect   off;
    port_in_redirect    off;
    server_name_in_redirect off;

    # Response charset (F-025).
    charset utf-8;

    # ── Security headers (HSTS handled at nginx-proxy, T-11 / F-007) ──
    # Repeated in every location that has its own add_header (nginx does not
    # inherit them there): the SPA shell had no CSP before D-20261108-02.
    include /etc/nginx/security_headers.conf;

    # Hide upstream backend identification (F-014).
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ── Body size defaults — tightened to match upstream parsers (T-07 / F-008) ──
    # Global default: 1m. Each API location lifts to match its parser.
    client_max_body_size 1m;

    # ── Proxy timeouts (T-16 / F-016) ──
    # Keep slowloris tight; per-location overrides for long-running routes.
    proxy_connect_timeout 3s;
    proxy_send_timeout    15s;
    proxy_read_timeout    30s;

    # ── HTTP/1.1 upstream + keepalive-friendly (T-17) ──
    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # ── Gzip ──
    gzip on;
    gzip_proxied   any;                          # F-018 / T-19
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # ── JSON error pages (T-05 / F-005) ──
    # Scoped via named @locations so the SPA catch-all still receives HTML 404s
    # for deep links. The backend routes (/api/, /files/, /notifications/,
    # /sync/) invoke these via `error_page` inside their blocks.
    location @json_not_found {
        default_type application/json;
        return 404 '{"success":false,"message":"Not found","code":"NOT_FOUND"}';
    }
    location @json_too_large {
        default_type application/json;
        return 413 '{"success":false,"message":"Payload too large","code":"PAYLOAD_TOO_LARGE"}';
    }
    location @json_too_many {
        default_type application/json;
        return 429 '{"success":false,"message":"Too many requests","code":"RATE_LIMITED"}';
    }
    location @real_bad_gateway {
        # Return a real 502 so the SPA / caller knows the backend is down.
        # The soft-200 fallback (D-20260419-05) was removed 2026-04-18 after
        # repeatedly masking actual outages and leaving the SPA rendering
        # empty JSON as HTML on deep-link refreshes.
        default_type application/json;
        return 502 '{"success":false,"message":"Backend temporarily unavailable","code":"BAD_GATEWAY"}';
    }

    # ── Health checks ──
    # Local nginx health (Docker HEALTHCHECK hits this).
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }
    # Upstream health pass-through — separate from /api rate-limit (T-25).
    location = /healthz {
        access_log off;
        limit_req zone=api_zone burst=10 nodelay;
        proxy_pass $api_server/healthz;
        include /etc/nginx/proxy_params;
    }

    # ── Auth endpoints — strict rate limit (brute-force protection, T-20) ──
    # Explicit boundary after each name to prevent future path-param regressions
    # (F-021). Password sign-in is gone (D-20261107-03): login, register,
    # forgot-password and reset-password no longer exist in the API. They stay
    # in this list so scripted password sprays are throttled here (429) before
    # they reach the API (404). Microsoft SSO is not in this zone: a whole
    # office signs in from one IP.
    location ~ ^/api/auth/(login|refresh|register|forgot-password|reset-password)(/|$) {
        limit_req  zone=auth_zone burst=3 nodelay;
        limit_conn conn_per_ip 20;
        client_max_body_size 64k;

        error_page 404     = @json_not_found;
        error_page 413     = @json_too_large;
        error_page 429     = @json_too_many;
        error_page 502 503 504 = @real_bad_gateway;

        proxy_pass $api_server;
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        include /etc/nginx/proxy_params;
    }

    # ── API Server (everything else under /api) ──
    # ── CBP staff import (D-20260713-01) ──
    # Synchronous: CBP fetch (up to 3 attempts x 30s) plus per-record writes can
    # outlast the 30s /api/ read timeout, which made the browser see a 502 while
    # the import kept running. Raised for this one POST only. Never replayed:
    # a second upstream attempt would race the in-flight guard.
    location = /api/admin/import-cbp-users {
        limit_req  zone=api_zone burst=60 nodelay;
        limit_conn conn_per_ip 200;

        error_page 502 503 504 = @real_bad_gateway;

        proxy_pass $api_server;
        proxy_read_timeout 180s;
        proxy_next_upstream off;
        include /etc/nginx/proxy_params;
    }

    # ── CBP Staff Portal SSO (D-20261110-01) ──
    # The portal POSTs to /staff/planning/sso/accept; Apache strips the prefix,
    # so it arrives here as /sso/accept. Body is a small urlencoded form.
    location = /sso/accept {
        limit_req  zone=api_zone burst=10 nodelay;
        limit_conn conn_per_ip 20;
        client_max_body_size 16k;

        error_page 404     = @json_not_found;
        error_page 429     = @json_too_many;
        error_page 502 503 504 = @real_bad_gateway;

        proxy_pass $api_server/api/auth/cbp/accept;
        proxy_next_upstream error timeout;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req  zone=api_zone burst=60 nodelay;
        limit_conn conn_per_ip 200;

        # 50m ceiling for multipart uploads (budget execution workbook, capped
        # at 15 MB by multer). JSON bodies, base64 evidence included, are
        # capped by express.json({limit:'10mb'}). The /api/evidence disk
        # upload is gone (D-20261108-02).
        # F-008 / T-07 — flagged by executor-nginx-proxy during coordination.
        client_max_body_size 50m;

        error_page 404     = @json_not_found;
        error_page 413     = @json_too_large;
        error_page 429     = @json_too_many;
        error_page 502 503 504 = @real_bad_gateway;

        proxy_pass $api_server;
        # Safer retry policy — never retry non-idempotent (POST/PATCH/DELETE)
        # on a response; only on connect/timeout (T-18 / F-018).
        proxy_next_upstream error timeout non_idempotent;
        include /etc/nginx/proxy_params;
    }

    # ── Notification Service ──
    location /notifications/ {
        limit_req  zone=api_zone burst=20 nodelay;
        limit_conn conn_per_ip 20;
        client_max_body_size 1m;

        error_page 404     = @json_not_found;
        error_page 429     = @json_too_many;
        error_page 502 503 504 = @real_bad_gateway;

        proxy_pass $notification_service/;
        proxy_next_upstream error timeout non_idempotent;
        include /etc/nginx/proxy_params;
    }

    # ── Sync Service ──
    location /sync/ {
        limit_req  zone=api_zone burst=10 nodelay;
        limit_conn conn_per_ip 10;
        client_max_body_size 1m;

        error_page 404     = @json_not_found;
        error_page 429     = @json_too_many;
        error_page 502 503 504 = @real_bad_gateway;

        proxy_pass $sync_service/;
        proxy_next_upstream error timeout non_idempotent;
        include /etc/nginx/proxy_params;
    }

    # ── Frontend (web-app container) — catch-all ──
    # Defensive: the SPA HTML entry point is NEVER cacheable, so if the
    # gateway ever returns anything non-HTML (historical bug with the
    # soft-502 JSON envelope), users don't get stuck on a stale cache.
    # Hashed assets (/assets/*.js, *.css) go through the block below and
    # keep their long-term caching untouched.
    location /assets/ {
        proxy_pass $web_app;
        proxy_next_upstream error timeout;
        include /etc/nginx/proxy_params;
        expires 1y;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
    # Version probe — the SPA polls this every 60 s. Must NEVER be cached
    # anywhere (gateway, browser, proxies) or stale-detection breaks.
    location = /version.json {
        proxy_pass $web_app;
        include /etc/nginx/proxy_params;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location / {
        limit_conn conn_per_ip 200;
        proxy_pass $web_app;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        include /etc/nginx/proxy_params;

        # ── Stale-if-error cache ──
        # Gateway caches the SPA HTML shell for a few seconds.  When the
        # web-app container is briefly unreachable (redeploy, crash loop,
        # timeout) nginx serves the last-good copy for up to 30 days
        # instead of surfacing a 5xx to the user. Once the upstream is
        # back, the next request refreshes the cache. Browsers keep
        # `no-store` so they always come back to nginx for a fresh copy.
        proxy_cache spa_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 302 10s;
        proxy_cache_valid 404 5s;
        proxy_cache_use_stale error timeout updating invalid_header
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        include /etc/nginx/security_headers.conf;
        add_header X-Cache-Status $upstream_cache_status always;

        # Browser must never cache the HTML shell itself — we only rely
        # on the nginx cache above. Hashed assets (/assets/*) keep long
        # lived caching via their own block.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        # Last-resort: if even the stale cache is empty (fresh deploy,
        # never warmed), render a tiny self-refreshing HTML page instead
        # of exposing nginx's default 502.
        error_page 502 503 504 = @spa_bad_gateway;
    }
    location @spa_bad_gateway {
        default_type text/html;
        include /etc/nginx/security_headers.conf;
        add_header Cache-Control "no-store" always;
        # Auto-reload every 2s so users don't stare at an error page —
        # as soon as the cache or upstream recovers, they land on the
        # real app without doing anything.
        return 503 '<!doctype html><html><head><meta charset=utf-8><title>Loading Africa CDC RBM…</title><meta http-equiv="refresh" content="2"><style>body{font-family:-apple-system,Segoe UI,sans-serif;background:#f7fafc;color:#2d3748;text-align:center;padding:80px 20px}h1{font-size:16px;color:#1A5632;font-weight:600}p{font-size:12px;color:#718096}.spinner{display:inline-block;width:18px;height:18px;border:2px solid #1A5632;border-top-color:transparent;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><h1><span class=spinner></span>Loading Africa CDC RBM…</h1><p>Reconnecting — this page will refresh itself.</p></body></html>';
    }

    # ── Block common attack paths — respond with structured JSON 403 so it
    #    shows up in access logs rather than silently dropping (F-020 / T-28) ──
    location ~ \.(php|asp|aspx|jsp|cgi)$ {
        default_type application/json;
        return 403 '{"success":false,"message":"Forbidden","code":"FORBIDDEN_PATH"}';
    }
    location ~ /\.(git|env|htaccess|cleanup|svn) {
        default_type application/json;
        return 403 '{"success":false,"message":"Forbidden","code":"FORBIDDEN_PATH"}';
    }
    location /wp-admin       { return 403 '{"success":false,"message":"Forbidden","code":"FORBIDDEN_PATH"}'; }
    location /wp-login.php   { return 403 '{"success":false,"message":"Forbidden","code":"FORBIDDEN_PATH"}'; }
}
