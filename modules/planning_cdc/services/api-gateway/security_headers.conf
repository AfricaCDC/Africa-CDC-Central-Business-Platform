# Security headers of every gateway response (D-20260415-09, D-20261108-02).
# nginx drops the server-level add_header lines in any location that declares
# its own add_header, so every such location includes this file again.
# HSTS is owned by the edge proxy (nginx-proxy).
add_header X-Frame-Options          "DENY" always;
add_header X-Content-Type-Options   "nosniff" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
# CSP (T-03 / F-002): no 'unsafe-eval' or 'unsafe-inline' in script-src.
# Inline styles stay allowed (Tailwind runtime classes and style attributes).
add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
