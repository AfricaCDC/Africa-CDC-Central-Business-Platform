##
# RBM Platform — Public nginx-proxy
# Sits in front of api-gateway. TLS terminated here, plain HTTP forwarded
# to api-gateway:80 on the internal Docker network.
#
# This file runs only in the staging/prod Docker stack (api-gateway hostname
# is a Docker service name). Local dev bypasses both nginx layers entirely:
# the Vite dev server proxies directly to localhost:400x per CLAUDE.md
# port mapping. See docs/guides/nginx.md.
#
# Phase-3 cleanup: Sprint-3 hardening (T-04, T-05, T-07, T-14, T-16, T-17),
# COOP/COEP/CORP (T-08..T-10), body-size alignment with multer (T-03),
# tracing (T-11), keepalive (T-19), JSON error envelope at edge (T-21).
# T-02 (outer /pdf timeout) is obsolete — pdf-service retired per
# D-20260415-08; see docs/DECISIONS.md and docs/OBSOLETE.md §14.
# Source: .cleanup/reports/phase2/per-service/nginx-proxy.md
##

# ── Hide nginx version in Server: header (T-05 / F-005) ──
server_tokens off;

# ── Custom log format with timing + tracing fields (F-019, supports T-11) ──
log_format edge '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" '
                'rid=$http_x_request_id rt=$request_time '
                'urt=$upstream_response_time ua=$upstream_addr';

# ── HTTP server: ACME challenge + redirect everything else to HTTPS ──
server {
    listen 80 default_server;
    server_name pra.africacdc.org _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_gateway http://api-gateway:80;

    access_log /var/log/nginx/access.log edge;

    # Search engine deindexing on HTTP too (defense in depth)
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive, noimageindex" always;

    # Let's Encrypt HTTP-01 challenge (used during cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health bypass — keeps `make health` working over plain HTTP for ops
    location = /health {
        access_log off;
        proxy_pass $api_gateway/health;
        proxy_set_header Host $host;
    }

    # robots.txt also reachable on HTTP just in case
    location = /robots.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──
server {
    listen 443 ssl;
    http2  on;
    server_name pra.africacdc.org;

    # ── TLS config (T-04 modern ciphers, T-07 OCSP stapling) ──
    ssl_certificate     /etc/letsencrypt/live/pra.africacdc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pra.africacdc.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Mozilla "Intermediate" 2024-Q1 — generated from https://ssl-config.mozilla.org/
    # ECDHE-only, AEAD-only. Forward secrecy enforced.
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    # OCSP stapling (T-07 / F-010) — chain.pem must exist for stapling to work.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/pra.africacdc.org/chain.pem;

    # ── Resolver: Docker embedded DNS only ──
    # Previously also listed 1.1.1.1/8.8.8.8 "for OCSP lookups", but this
    # `resolver` directive is shared by every DNS lookup in this server
    # block — including the per-request $api_gateway resolution below. nginx
    # distributes queries across all configured nameservers, so some
    # requests for the internal-only name "api-gateway" were being sent to
    # a PUBLIC resolver, which correctly answers NXDOMAIN for a name that
    # only exists on the Docker network. That surfaced as constant
    # production BAD_GATEWAY 502s (confirmed in nginx-proxy logs: "api-gateway
    # could not be resolved (3: Host not found)", continuously since at
    # least 2026-06-25, ~5% of all requests) even though api-gateway was
    # always healthy. The OCSP responder the public resolvers were for is
    # moot anyway — `ssl_stapling` already logs "ignored, no OCSP responder
    # URL in the certificate". Docker's own resolver is the only one that
    # can ever answer for internal service names; use only that, matching
    # the plain-HTTP server block above and services/api-gateway/nginx.conf.
    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 5s;
    set $api_gateway http://api-gateway:80;

    access_log /var/log/nginx/access.log edge;

    # ── Security headers ──
    # T-14 HSTS: includeSubDomains + preload + 2-year max-age (only safe once
    # *.africacdc.org is 100% HTTPS; confirm with ops before submitting to
    # Chrome preload list per F-022).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options          "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    # T-16: stricter than no-referrer for cross-site links while still hiding path/query
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # T-17: explicitly disable unused powerful APIs
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    # T-08, T-10: cross-origin isolation. COEP (T-09) intentionally NOT enabled
    # yet — requires every cross-origin asset to send CORP. Re-evaluate once
    # web-app audit confirms no third-party <img>/<script> dependencies.
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site"   always;
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;  # T-09 deferred

    # ── Search engine deindexing — blocks Google/Bing/Yandex/etc. ──
    # Internal app, must NEVER appear in any public search index.
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive, noimageindex" always;

    absolute_redirect off;

    # /robots.txt — explicit disallow for every crawler
    location = /robots.txt {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive, noimageindex" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ai.txt — block AI crawlers (GPTBot, ClaudeBot, anthropic-ai, etc.)
    location = /ai.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # security.txt — RFC 9116 contact for vulnerability reports
    location = /.well-known/security.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "Contact: mailto:security@africacdc.org\nExpires: 2027-01-01T00:00:00Z\nPreferred-Languages: en\n";
    }

    # ── Body limit ──
    # T-03 / F-003: outer cap is 100m so multer (50MB inner) is the limiter
    # and the user sees the app's JSON error envelope, not nginx's HTML 413.
    client_max_body_size 100m;

    # ── Compression (gzip; brotli deferred — base image lacks ngx_brotli) ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Common proxy headers ──
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # T-11 / F-018: propagate inbound X-Request-ID if present, else generate.
    # api-gateway and downstream Node services must reuse this exact value.
    proxy_set_header X-Request-ID      $http_x_request_id;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # T-19 / F-021: keepalive tuning (modest — light traffic today)
    keepalive_timeout  65s;
    keepalive_requests 500;

    # T-13: nginx-proxy ↔ api-gateway is plain HTTP on the internal Docker
    # network (no TLS), so proxy_ssl_verify is N/A. Documented; revisit only
    # if api-gateway is ever moved off-host.

    # Health check
    location = /health {
        access_log off;
        proxy_pass $api_gateway/health;
    }

    # T-21 / Sprint-1: canonical JSON error envelope at the edge so clients
    # never see nginx's HTML 404/502/504 page. Matches packages/lib/errors.js
    # shape: { success:false, message, code }.
    # Reverted 2026-04-20: the soft-502 trick (mapping 502 → 200 + empty
    # body) masked too many real backend failures silently. Restore canonical
    # 502 with a proper error envelope so the UI can show a real error.
    error_page 404 = @err_not_found;
    error_page 502 = @err_bad_gateway;
    error_page 503 = @err_unavailable;
    error_page 504 = @err_timeout;
    proxy_intercept_errors on;

    location @err_not_found {
        default_type application/json;
        return 404 '{"success":false,"message":"Resource not found.","code":"NOT_FOUND"}';
    }
    location @err_bad_gateway {
        default_type application/json;
        return 502 '{"success":false,"message":"Upstream service unavailable.","code":"BAD_GATEWAY"}';
    }
    location @err_unavailable {
        default_type application/json;
        return 503 '{"success":false,"message":"Service temporarily unavailable.","code":"UPSTREAM_UNAVAILABLE"}';
    }
    location @err_timeout {
        default_type application/json;
        return 504 '{"success":false,"message":"Upstream timed out.","code":"UPSTREAM_TIMEOUT"}';
    }

    # Pass everything else to the internal api-gateway
    location / {
        proxy_pass $api_gateway;
        # Absorb a brief api-gateway/api-server restart window: retry the
        # upstream once on a connection error/timeout or a transient 5xx
        # before falling through to the @err_bad_gateway envelope. Stops a
        # 1-2s backend blip from surfacing as BAD_GATEWAY to users.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 12s;

        # Docker's embedded DNS (127.0.0.11) intermittently answers NXDOMAIN
        # for "api-gateway" even though the container is healthy — observed
        # in production nginx-proxy logs continuously since 2026-06-25 at
        # ~5% of requests ("api-gateway could not be resolved (3: Host not
        # found)"), interleaved second-by-second with successful resolutions
        # on the same host. proxy_next_upstream above does NOT cover this:
        # resolution happens before any upstream connection exists, so there
        # is nothing to "next" to. Retry the whole request once, which
        # forces a fresh resolver lookup — safe for every HTTP method
        # because a resolution failure means the request never reached
        # api-gateway in the first place (nothing to double-execute).
        error_page 502 = @api_gateway_retry;
    }

    location @api_gateway_retry {
        proxy_pass $api_gateway;
    }

    # Block common attack paths (extends F-025 with a few extra scan paths)
    location ~ /\.(git|svn|hg|bzr|env|htaccess|DS_Store) { return 444; }
    location ~ \.(php|asp|aspx|jsp)$                     { return 444; }
    location /wp-admin                                   { return 444; }
    location /wp-login.php                               { return 444; }
    location /phpmyadmin                                 { return 444; }
    location /adminer                                    { return 444; }
    location /server-status                              { return 444; }
}
